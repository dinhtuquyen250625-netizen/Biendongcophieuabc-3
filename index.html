<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Biến Động Giá Cổ Phiếu</title>
    <!-- Nhúng font chữ hiện đại từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập giao diện nền tối chuẩn tài chính */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Khung tiêu đề trang trí */
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        p {
            color: #8a99ad;
            font-size: 14px;
        }

        /* Khung chứa video (Hiệu ứng khung kính mờ sang trọng) */
        .video-container {
            background: rgba(25, 33, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }

        /* Thẻ video hiển thị */
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        /* Chân trang */
        footer {
            margin-top: 25px;
            color: #5a6b82;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Phân Tích Biến Động Giá Cổ Phiếu Chu Kỳ 365 Ngày</h1>
        <p>Hệ thống mô phỏng dữ liệu giao dịch tài chính tự động</p>
    </header>

    <div class="video-container">
        <!-- Chèn file video của bạn vào đây -->
        <video controls autoplay loop muted>
            <source src="stock_simulation_output.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video HTML5.
        </video>
    </div>

    <footer>
        &copy; 2026 - Dự án Mô phỏng Tài chính cá nhân
    </footer>

</body>
</html>
