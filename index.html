<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích & Mô Phỏng Biến Động Giá Cổ Phiếu</title>
    <!-- Nhúng font chữ Inter từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111622;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #00ffcc;
            --accent-orange: #ff9900;
            --accent-red: #ff4d4d;
            --text-main: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            max-width: 1050px;
            width: 100%;
        }

        /* Tiêu đề Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 25px;
        }

            background-color: rgba(0, 255, 204, 0.1);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
